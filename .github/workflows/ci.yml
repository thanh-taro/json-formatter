# Pull-request and main-branch checks (ADR-0003, ADR-0009, ADR-0010, MOD-Build).
# Actions are pinned by commit SHA (DEP-34).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Keep GITHUB_TOKEN out of .git/config, where later steps (dependencies) could read it.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Codegen is up to date (tokens, copy, notices, _headers)
        run: pnpm gen:check

      - name: Spec lint
        run: python3 tools/spec_lint.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: JSONTestSuite corpus
        run: pnpm fixtures:jsontestsuite

      - name: Unit, property and conformance tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: License audit and dist/ scan (ADR-0001)
        run: pnpm check:licenses

      - name: Size budget (NFR-05)
        run: pnpm check:size

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (Chromium)
        run: pnpm exec playwright test --project=chromium
