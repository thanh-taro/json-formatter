# Publish to Cloudflare Workers static assets (ADR-0009, MOD-Build, DEP-33, DEP-34).
# Runs by hand (workflow_dispatch) or when a version tag v* is pushed. Never on a branch push.
#   1. `check`  : every CI check, then the production build (HOST_ORIGINS=https://tarokit.app).
#                 No secrets are available to this job (it runs project code and dependencies).
#   2. `deploy` : environment `production` (the owner can require an approval there), uploads dist/
#                 with wrangler, then runs the post-deploy smoke test (QA-026) as its last step.
# The Cloudflare token and account id are repository/environment secrets created by the owner;
# they are exposed to the single deploy step only. Actions are pinned by commit SHA (DEP-34).
name: Deploy

on:
  workflow_dispatch:
    inputs:
      sw_kill:
        description: 'Recovery only: ship the offline kill switch (SW_KILL=1) instead of the normal worker'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: read

# One deploy at a time; a running deploy is never cancelled half way.
concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Origin allowed to frame the tool (frame-ancestors + compiled-in message allow-list, D-009).
  HOST_ORIGINS: https://tarokit.app
  SITE_URL: https://json-formatter.tarokit.app
  WRANGLER_SEND_METRICS: 'false'

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # tag runs verify the tagged commit is on main

      - name: Tagged commit is on main and the tag matches package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          version="$(node -p "require('./package.json').version")"
          [ "$TAG" = "v$version" ] || { echo "::error::tag $TAG does not match package.json version $version"; exit 1; }

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Codegen is up to date (tokens, copy, notices, _headers)
        run: pnpm gen:check

      - name: Spec lint
        run: python3 tools/spec_lint.py

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: JSONTestSuite corpus
        run: pnpm fixtures:jsontestsuite

      - name: Unit, property and conformance tests
        run: pnpm test

      - name: Build (production HOST_ORIGINS)
        run: pnpm build

      - name: License audit and dist/ scan (ADR-0001)
        run: pnpm check:licenses

      - name: Size budget (NFR-05)
        run: pnpm check:size

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E smoke (Chromium)
        run: pnpm exec playwright test --project=chromium

      # Recovery deploys only: the e2e suite above tests the normal worker, so the kill-switch
      # build replaces dist/ after every check has passed.
      - name: Rebuild with the offline kill switch (SW_KILL=1)
        if: github.event_name == 'workflow_dispatch' && inputs.sw_kill
        env:
          SW_KILL: '1'
        run: pnpm build

      - name: Production headers carry the portal origin and nothing else
        run: |
          grep -q 'frame-ancestors https://tarokit.app$' dist/_headers
          test -f dist/.assetsignore
          grep -q '^\*\.map$' dist/.assetsignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist
          include-hidden-files: true # .assetsignore and .vite
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Created on first use; add "Required reviewers" (yourself) in the repository settings to
    # approve each deploy. Put CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in this environment.
    environment:
      name: production
      url: ${{ env.SITE_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install (wrangler, Playwright)
        run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist

      - name: Deploy dist/ with wrangler (source maps and the Vite manifest are excluded by dist/.assetsignore)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

      - name: Install Playwright Chromium for the smoke test
        run: pnpm exec playwright install --with-deps chromium

      # Last step (QA-026). A failure here means the live site is wrong: follow "Rollback" in
      # .build-my-app/reports/release-checklist.md.
      - name: Post-deploy smoke test
        run: pnpm smoke:prod "$SITE_URL"
