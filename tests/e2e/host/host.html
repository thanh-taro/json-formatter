<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Stub portal host</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #203040;
        color: #fff;
        font: 13px system-ui;
      }
      iframe {
        display: block;
        border: 0;
        width: 1200px;
        height: 760px;
      }
      iframe.sibling {
        width: 1px;
        height: 1px;
      }
    </style>
  </head>
  <body>
    <script>
      // Embeds the tool with the portal's frame attributes (architecture.md A3, ADR-0008) and
      // behaves like the portal after its theme change request: theme in the address, a
      // taro:theme message with the tool's exact origin, the current theme in reply to ready.
      // Query: tool=<origin> (default http://localhost:4173), theme=light|dark|none, w, h,
      // sibling=1 (adds a frame from the unlisted origin that can post into the tool frame).
      const q = new URLSearchParams(location.search);
      const TOOL = q.get('tool') || 'http://localhost:4173';
      let theme = q.get('theme') || 'dark';
      window.__host = { received: [], loads: 0 };
      const f = document.createElement('iframe');
      f.name = 'tool';
      f.title = 'JSON Formatter';
      f.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-downloads');
      f.setAttribute('allow', 'clipboard-write');
      f.setAttribute('referrerpolicy', 'strict-origin');
      if (q.get('w')) f.style.width = q.get('w') + 'px';
      if (q.get('h')) f.style.height = q.get('h') + 'px';
      // Fires for a frame the browser refused to display too (F-008.AC8 waits on it).
      f.addEventListener('load', () => window.__host.loads++);
      f.src = TOOL + '/' + (theme === 'none' ? '' : '?theme=' + encodeURIComponent(theme));
      window.addEventListener('message', (e) => {
        const fromTool = e.source === f.contentWindow;
        window.__host.received.push({ origin: e.origin, data: e.data, fromTool });
        if (fromTool && e.data && e.data.type === 'taro:ready' && theme !== 'none') {
          f.contentWindow.postMessage({ type: 'taro:theme', value: theme }, TOOL);
        }
      });
      window.setTheme = (value) => {
        theme = value;
        f.contentWindow.postMessage({ type: 'taro:theme', value }, TOOL);
      };
      window.postRaw = (data) => f.contentWindow.postMessage(data, TOOL);
      window.resizeTool = (w, h) => {
        f.style.width = w + 'px';
        f.style.height = h + 'px';
      };
      document.body.append(f);
      if (q.get('sibling')) {
        // An unlisted origin inside the allowed host page reaches the tool through parent.frames.
        const s = document.createElement('iframe');
        s.name = 'sibling';
        s.className = 'sibling';
        s.title = 'Unlisted sibling';
        s.src = 'http://localhost:4175/sibling.html';
        document.body.append(s);
        window.fireSibling = (msg) => s.contentWindow.postMessage({ cmd: 'fire', msg }, '*');
      }
    </script>
  </body>
</html>
