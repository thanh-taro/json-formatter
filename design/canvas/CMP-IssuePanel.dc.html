<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Issue panel variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--accent2Fg:#FFC48A;--danger:#FF8595;--dangerBg:#3A1622;--warnBg:#33240F;color-scheme:dark}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--accent2Fg:#8F4705;--danger:#C0243B;--dangerBg:#FCE8EC;--warnBg:#FDEBD8;color-scheme:light}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.lab{font:500 12px 'JetBrains Mono',ui-monospace,monospace;color:var(--muted)}
.panel{border:1px solid var(--line);background:var(--surface)}
.head{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px;border-bottom:1px solid var(--line)}
.tab{height:32px;padding:0 8px;display:inline-flex;align-items:center;border:0;background:none;color:var(--muted);font:600 12px Manrope,system-ui,sans-serif}
.tab[aria-selected="true"]{color:var(--fg);box-shadow:inset 0 -2px 0 var(--accent)}
.ibtn{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;border:0;border-radius:7px;background:none;color:var(--muted)}
.ibtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.list{list-style:none;margin:0;padding:0}
.list li{border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.row{width:100%;display:grid;grid-template-columns:76px 1fr auto;gap:4px 12px;align-items:baseline;padding:8px 12px;box-sizing:border-box;border:0;background:none;color:var(--fg);text-align:left;font:500 13px/20px Manrope,system-ui,sans-serif}
.row.hover{background:var(--surface2)}
.sev{justify-self:start;font:600 12px 'JetBrains Mono',monospace;padding:0 8px;border-radius:999px;line-height:20px}
.sev.e{color:var(--danger);background:var(--dangerBg)}
.sev.w{color:var(--accent2Fg);background:var(--warnBg)}
.loc{font:400 12px 'JetBrains Mono',monospace;color:var(--muted);white-space:nowrap}
.code{grid-column:2 / -1;font:400 12px 'JetBrains Mono',monospace;color:var(--muted)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,.fv{outline:2px solid var(--accent);outline-offset:2px}
.row:focus-visible,.row.fv,.seg button:focus-visible,.seg button.fv,.r:focus-visible,.r.fv,.txt:focus-visible,.txt.fv,[role="textbox"].fv{outline-offset:-2px}
</style>
</helmet>
<div style="width:1280px;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;gap:48px;background:#0B0810">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tk-{{t.id}}" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;padding:24px;border-radius:12px;background:var(--bg);color:var(--fg);align-items:start">
  <span id="ip-c-{{t.id}}" class="vh" data-copy="COPY-action.collapse_issues">Hide issues</span>
  <span id="ip-e-{{t.id}}" class="vh" data-copy="COPY-action.expand_issues">Show issues</span>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lab">CMP-IssuePanel / error / {{t.id}}</span>
    <section class="panel" aria-label="Issues">
      <div class="head" role="tablist">
        <button type="button" class="tab" role="tab" id="ip-a1-{{t.id}}" aria-selected="true" aria-controls="ip-ap-{{t.id}}" data-copy="COPY-issue.tab_problems">Problems (1)</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-copy="COPY-issue.tab_warnings">Warnings (0)</button>
        <div style="flex:1"></div>
        <button type="button" class="ibtn" aria-expanded="true" aria-labelledby="ip-c-{{t.id}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      </div>
      <div role="tabpanel" id="ip-ap-{{t.id}}" aria-labelledby="ip-a1-{{t.id}}">
        <ul class="list">
          <li><button type="button" class="row fv hover">
            <span class="sev e" data-copy="COPY-issue.error">Error</span>
            <span data-copy="COPY-hint.trailing_comma">Remove the comma after the last item — JSON doesn't allow trailing commas.</span>
            <span class="loc" data-copy="COPY-issue.location">Line 8, column 50</span>
            <span class="code">trailing-comma</span>
          </button></li>
        </ul>
      </div>
    </section>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lab">CMP-IssuePanel / collapsed / {{t.id}}</span>
    <section class="panel" aria-label="Issues">
      <div class="head" role="tablist" style="border-bottom:0">
        <button type="button" class="tab" role="tab" aria-selected="false" data-copy="COPY-issue.tab_problems">Problems (0)</button>
        <button type="button" class="tab" role="tab" aria-selected="false" data-copy="COPY-issue.tab_warnings">Warnings (1,204)</button>
        <div style="flex:1"></div>
        <button type="button" class="ibtn" aria-expanded="false" aria-labelledby="ip-e-{{t.id}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 14l5-5 5 5"/></svg></button>
      </div>
    </section>
  </div>

  <div style="display:flex;flex-direction:column;gap:8px;grid-column:1 / -1">
    <span class="lab">CMP-IssuePanel / warnings · at size.issuePanelMax, list scrolls / {{t.id}}</span>
    <section class="panel" aria-label="Issues" style="height:240px;display:flex;flex-direction:column">
      <div class="head" role="tablist">
        <button type="button" class="tab" role="tab" aria-selected="false" data-copy="COPY-issue.tab_problems">Problems (0)</button>
        <button type="button" class="tab" role="tab" id="ip-w2-{{t.id}}" aria-selected="true" aria-controls="ip-wp-{{t.id}}" data-copy="COPY-issue.tab_warnings">Warnings (1,204)</button>
        <div style="flex:1"></div>
        <button type="button" class="ibtn" aria-expanded="true" aria-labelledby="ip-c-{{t.id}}"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></button>
      </div>
      <div role="tabpanel" id="ip-wp-{{t.id}}" aria-labelledby="ip-w2-{{t.id}}" style="flex:1;min-height:0;overflow-y:auto">
        <ul class="list">
          <li><button type="button" class="row">
            <span class="sev w" data-copy="COPY-issue.warning">Warning</span>
            <span data-copy="COPY-hint.byte_order_mark">The document starts with a byte-order mark. It's kept, but some tools reject it.</span>
            <span class="loc" data-copy="COPY-issue.location">Line 1, column 1</span>
            <span class="code">byte-order-mark</span>
          </button></li>
          <li><button type="button" class="row">
            <span class="sev w" data-copy="COPY-issue.warning">Warning</span>
            <span data-copy="COPY-hint.unsafe_number">This number is kept exactly here, but many languages (including JavaScript) will round it.</span>
            <span class="loc" data-copy="COPY-issue.location">Line 3, column 11</span>
            <span class="code">unsafe-number</span>
          </button></li>
          <li><button type="button" class="row">
            <span class="sev w" data-copy="COPY-issue.warning">Warning</span>
            <span data-copy="COPY-hint.duplicate_key">This key appears more than once in the same object. Many parsers keep only the last one.</span>
            <span class="loc" data-copy="COPY-issue.location">Line 41, column 5</span>
            <span class="code">duplicate-key</span>
          </button></li>
          <li style="padding:8px 12px 8px 100px;font:500 13px/20px Manrope,system-ui,sans-serif;color:var(--muted)" data-copy="COPY-issue.more">…and 204 more warnings</li>
        </ul>
      </div>
    </section>
  </div>

</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1300}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ id: 'dark' }, { id: 'light' }] };
  }
}
</script>
</body>
</html>
