<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Confirm dialog</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--onAccent:#0F0B16;--scrim:#07050BB3;--syntaxKey:#8CCBFF;--syntaxString:#7FE3B8;--syntaxPunct:#9C92B0;color-scheme:dark}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--onAccent:#FFFFFF;--scrim:#16111F66;--syntaxKey:#0B5A94;--syntaxString:#0B6B49;--syntaxPunct:#5E566F;color-scheme:light}
.lab{font:500 12px 'JetBrains Mono',ui-monospace,monospace;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;height:28px;padding:0 12px;box-sizing:border-box;border:1px solid var(--lineStrong);border-radius:7px;background:none;color:var(--fg);font:500 13px Manrope,system-ui,sans-serif}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onAccent)}
.btn.focus{outline:2px solid var(--accent);outline-offset:2px}
.k{color:var(--syntaxKey)}.s{color:var(--syntaxString)}.p{color:var(--syntaxPunct)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,.fv{outline:2px solid var(--accent);outline-offset:2px}
.row:focus-visible,.row.fv,.seg button:focus-visible,.seg button.fv,.r:focus-visible,.r.fv,.txt:focus-visible,.txt.fv,[role="textbox"].fv{outline-offset:-2px}
</style>
</helmet>
<div style="width:1280px;box-sizing:border-box;padding:40px;display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;background:#0B0810">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tk-{{t.id}}" style="display:flex;flex-direction:column;gap:8px;padding:24px;border-radius:12px;background:var(--bg);color:var(--fg)">
  <span class="lab">CMP-ConfirmDialog / very large content / {{t.id}}</span>
  <div style="position:relative;height:380px;border:1px solid var(--line);background:var(--bg);overflow:hidden">
    <div aria-hidden="true" style="padding:4px 12px;font:400 13px/20px 'JetBrains Mono',monospace;white-space:pre;color:var(--fg)"><span class="p">{</span>
  <span class="k">"status"</span><span class="p">: </span><span class="s">"shipped"</span>
<span class="p">}</span></div>
    <div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:16px">
      <div role="dialog" aria-modal="true" aria-labelledby="cd-t-{{t.id}}" aria-describedby="cd-m-{{t.id}}" style="width:400px;max-width:100%;box-sizing:border-box;padding:24px;display:flex;flex-direction:column;gap:24px;border:1px solid var(--lineStrong);border-radius:10px;background:var(--surface)">
        <h2 id="cd-t-{{t.id}}" style="margin:0;font:600 17px/24px Manrope,system-ui,sans-serif;color:var(--fg)" data-copy="COPY-confirm.title">Large content</h2>
        <p id="cd-m-{{t.id}}" style="margin:0;font:500 14px/20px Manrope,system-ui,sans-serif;color:var(--fg)" data-copy="COPY-confirm.very_large">This content is 148.3 MB. Working with it may be slow or run out of memory. Continue anyway?</p>
        <div style="display:flex;justify-content:flex-end;gap:8px">
          <button type="button" class="btn focus" data-copy="COPY-action.cancel">Cancel</button>
          <button type="button" class="btn primary" data-copy="COPY-action.continue">Continue</button>
        </div>
      </div>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":640}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ id: 'dark' }, { id: 'light' }] };
  }
}
</script>
</body>
</html>
