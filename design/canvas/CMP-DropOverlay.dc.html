<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drop overlay variants</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.tk-dark{--bg:#0F0B16;--surface:#18121F;--surface2:#221A2F;--line:#2D2440;--lineStrong:#6F6290;--fg:#EFEAF8;--muted:#9C92B0;--accent:#A47BFF;--scrim:#07050BB3;--syntaxKey:#8CCBFF;--syntaxString:#7FE3B8;--syntaxPunct:#9C92B0;color-scheme:dark}
.tk-light{--bg:#FBFAFE;--surface:#FFFFFF;--surface2:#F1EDFA;--line:#E2DCF0;--lineStrong:#8C82A2;--fg:#16111F;--muted:#5E566F;--accent:#6837E0;--scrim:#16111F66;--syntaxKey:#0B5A94;--syntaxString:#0B6B49;--syntaxPunct:#5E566F;color-scheme:light}
.lab{font:500 12px 'JetBrains Mono',ui-monospace,monospace;color:var(--muted)}
.area{position:relative;height:200px;border:1px solid var(--line);background:var(--bg);font:400 13px/20px 'JetBrains Mono',ui-monospace,monospace;white-space:pre;padding:4px 12px;overflow:hidden;color:var(--fg)}
.k{color:var(--syntaxKey)}.s{color:var(--syntaxString)}.p{color:var(--syntaxPunct)}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible,.fv{outline:2px solid var(--accent);outline-offset:2px}
.row:focus-visible,.row.fv,.seg button:focus-visible,.seg button.fv,.r:focus-visible,.r.fv,.txt:focus-visible,.txt.fv,[role="textbox"].fv{outline-offset:-2px}
</style>
</helmet>
<div style="width:1280px;box-sizing:border-box;padding:40px;display:flex;flex-direction:column;gap:48px;background:#0B0810">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div class="tk-{{t.id}}" style="display:grid;grid-template-columns:repeat(2, minmax(0, 1fr));gap:24px;padding:24px;border-radius:12px;background:var(--bg);color:var(--fg)">
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lab">CMP-DropOverlay / hidden / {{t.id}}</span>
    <div class="area"><span class="p">{</span>
  <span class="k">"status"</span><span class="p">: </span><span class="s">"shipped"</span>
<span class="p">}</span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:8px">
    <span class="lab">CMP-DropOverlay / active / {{t.id}}</span>
    <div class="area"><span class="p">{</span>
  <span class="k">"status"</span><span class="p">: </span><span class="s">"shipped"</span>
<span class="p">}</span>
      <div aria-hidden="true" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--scrim)">
        <div style="position:absolute;inset:8px;border:2px dashed var(--accent);border-radius:10px"></div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 24px;border:1px solid var(--lineStrong);border-radius:10px;background:var(--surface);font:600 14px Manrope,system-ui,sans-serif;color:var(--fg);white-space:normal">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;stroke:var(--accent);fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
          <span data-copy="COPY-drop.hint">Drop a file to open it</span>
        </div>
      </div>
    </div>
  </div>
</div>
</sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  renderVals() {
    return { themes: [{ id: 'dark' }, { id: 'light' }] };
  }
}
</script>
</body>
</html>
